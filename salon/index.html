<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Миндаль · запись на маникюр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="">
<style>
  /* Стили (цвета и шрифты). Какой включён, решает CONFIG.look, для сравнения можно открыть ?look=a */
  :root {
    /* 0 — «Пудра», первый вариант */
    --bg: #F7F0EB;                     /* фон страницы */
    --card: #FFFBF8;                   /* карточки */
    --soft: #F1DDD7;                   /* мягкие блоки, ею же красится шапка Telegram */
    --mark: #B9736F;                   /* фирменная миндалинка и точки */
    --ink: #6B1E34;                    /* заголовки и кнопка */
    --accent: #94414F;                 /* вторая строка заголовка */
    --gold: #E2BE98;                   /* заявка ждёт ответа */
    --text: #2B1A1E;
    --muted: #65504F;
    --line: rgba(107, 30, 52, .16);
    --taken: #E7E0DC;                  /* занятое окошко */
    --taken-text: #A99D9A;
    --on-ink: #FFF8F4;                 /* текст на кнопке */
    --title: "Playfair Display", Georgia, serif;
    --title-weight: 400;
    --t: 1;                            /* масштаб заголовков: широкий шрифт делаем мельче */
    --script: "Playfair Display", Georgia, serif;
    --script-style: italic;
    --script-weight: 400;
    --body: "Manrope", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --body-weight: 500;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  /* A — «Синяя глазурь»: цвет 2027 года по WGSN, к нему розовый цветущего миндаля */
  :root[data-look="a"] {
    --bg: #F3F5F9; --card: #FFFFFF; --soft: #DDE5F6; --mark: #C9A96E; --ink: #1D2C74; --accent: #3A5FD8;
    --gold: #F3D58A; --text: #151A2D; --muted: #535C77; --line: rgba(29, 44, 116, .14);
    --taken: #E6E8EE; --taken-text: #98A0B3; --on-ink: #FFFFFF;
    --title: "Tenor Sans", Arial, sans-serif; --t: .86;
    --script: "Ysabeau Office", Georgia, serif; --script-style: italic; --script-weight: 400;
    --body: "Onest", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --body-weight: 400;
  }
  /* B — «Баклажан и шартрез»: густой баклажан, сиреневая бумага, капля зелёно-жёлтого */
  :root[data-look="b"] {
    --bg: #F2EFF3; --card: #FFFFFF; --soft: #E6DDEA; --mark: #AEB82E; --ink: #3B1C45; --accent: #7A4A8A;
    --gold: #DDE48C; --text: #20142A; --muted: #62556A; --line: rgba(59, 28, 69, .14);
    --taken: #E7E3E9; --taken-text: #A29AA7; --on-ink: #FFFFFF;
    --title: "Noto Serif Display", Georgia, serif; --title-weight: 300; --t: 1.04;
    --script: "Noto Serif Display", Georgia, serif; --script-style: italic; --script-weight: 300;
    --body: "Commissioner", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --body-weight: 400;
  }
  /* C — «Глина и апельсин»: белый, тёплая глина и яркий оранжевый акцент */
  :root[data-look="c"] {
    --bg: #FFFFFF; --card: #F7F0EB; --soft: #EDD3C4; --mark: #E2582B; --ink: #4A2318; --accent: #C94A1C;
    --gold: #F6C28B; --text: #24160F; --muted: #6A5448; --line: rgba(74, 35, 24, .14);
    --taken: #EFE9E6; --taken-text: #A8988F; --on-ink: #FFFFFF;
    --title: "Unbounded", Arial, sans-serif; --title-weight: 300; --t: .72;
    --script: "Unbounded", Arial, sans-serif; --script-style: normal; --script-weight: 300;
    --body: "Geologica", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --body-weight: 400;
  }
  /* D — «Розовый и луг»: яркий розовый и спокойный зелёный, оба из прогноза на 2027 */
  :root[data-look="d"] {
    --bg: #F5F7F1; --card: #FFFFFF; --soft: #F9D3E0; --mark: #6F9A5B; --ink: #213B2A; --accent: #B8336A;
    --gold: #F2D27A; --text: #18221B; --muted: #535F56; --line: rgba(33, 59, 42, .14);
    --taken: #E5E9E3; --taken-text: #98A39A; --on-ink: #FFFFFF;
    --title: "Prata", Georgia, serif; --t: .88;
    --script: "Jost", Arial, sans-serif; --script-style: italic; --script-weight: 300;
    --body: "Jost", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --body-weight: 400;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--mark) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--mark); }
  ::selection { background: var(--soft); color: var(--ink); }
  body {
    color: var(--text); background: var(--bg); caret-color: var(--ink);
    font-family: var(--body); font-size: 16px; font-weight: var(--body-weight); line-height: 1.5;
    min-height: 100dvh; overflow-x: hidden; font-variant-numeric: lining-nums;
  }
  #app { position: relative; max-width: 480px; min-height: 100dvh; margin: 0 auto; overflow-x: clip; background: var(--bg); }
  button, input, select { font-family: inherit; font-weight: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-underline-offset: 4px; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .in-tg .browser-only { display: none !important; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* Миндалинка: форма ногтя, фирменная деталь */
  /* Фирменная деталь: тонкая полоска цвета шампанского, к синему как золотая нить */
  .almond { display: inline-block; flex: none; width: 24px; height: 2px; border-radius: 1px; background: var(--mark); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 24px; border-radius: 4px; background: var(--ink); color: var(--on-ink); font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; transition: opacity .2s, transform .15s var(--ease); }
  .btn:active { opacity: .9; transform: scale(.98); }
  .btn.soft { background: var(--soft); color: var(--ink); }
  .btn + .btn { margin-top: 8px; }
  .round { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--ink); font-size: 20px; line-height: 1; }

  /* Заголовок: крупное слово, под него наезжает вторая строка */
  .ttl { margin: 0 0 24px; color: var(--ink); font: var(--title-weight) calc(40px * var(--t))/1 var(--title); text-transform: uppercase; }
  .ttl i { display: block; margin: -4px 0 0 28%; color: var(--accent); font-family: var(--script); font-size: calc(32px * var(--t)); font-style: var(--script-style); font-weight: var(--script-weight); line-height: 1.1; text-transform: none; }

  /* Переключатель для показа: в настоящем приложении панель видит только администратор */
  .modebar { position: sticky; top: 0; z-index: 30; display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: var(--card); box-shadow: 0 4px 16px rgba(0, 0, 0, .05); }
  .modebar small { flex: none; font-size: 12px; color: var(--muted); }
  .switch { flex: 1; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 8px; background: var(--soft); }
  .switch button { padding: 8px 4px; border-radius: 4px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .switch button.on { background: var(--ink); color: var(--on-ink); }

  /* Шапка: фото во весь экран, большое название уплывает при прокрутке */
  .hero { position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: flex-end; min-height: clamp(540px, calc(100svh - 150px), 680px); padding: 72px 20px 76px; overflow: hidden; background: var(--ink); color: #fff; }
  /* Фото стоит у верхнего края в своих пропорциях и растворяется в цвете своего же фона: руки видны целиком, вокруг воздух */
  .hero-pic { position: absolute; inset: 0; z-index: -2; overflow: hidden; background: var(--hero-bg, var(--soft)); }
  .hero-pic img { width: 100%; height: auto; margin-top: -56px; transform: scale(1.04); transform-origin: 50% 0; will-change: transform; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent 97%); mask-image: linear-gradient(180deg, #000 70%, transparent 97%); }
  .hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background:
      linear-gradient(180deg, color-mix(in srgb, var(--ink) 30%, transparent) 0%, transparent 16%, transparent 44%, color-mix(in srgb, var(--ink) 50%, transparent) 64%, color-mix(in srgb, var(--ink) 94%, #000) 100%),
      transparent; }
  .hero-kind { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: rgba(255, 255, 255, .86); }
  .hero h1 { margin: 0 -40px 0 -4px; color: #fff; font: var(--title-weight) calc(clamp(76px, 21vw, 104px) * var(--t))/.9 var(--title); text-transform: uppercase; white-space: nowrap; will-change: transform; }
  .hero-script { margin-top: 8px; color: #fff; font-family: var(--script); font-size: calc(32px * var(--t)); font-style: var(--script-style); font-weight: var(--script-weight); line-height: 1.1; }
  .hero-about { margin-top: 12px; max-width: 320px; color: rgba(255, 255, 255, .88); font-size: 16px; }
  .hero-btn { display: inline-flex; align-self: flex-start; width: auto; margin: 20px 0 0; background: #fff; color: var(--ink); }
  .intro .hero > :not(.hero-pic) { animation: rise .8s var(--ease) both; }
  .intro .hero > h1 { animation-delay: .06s; }
  .intro .hero > .hero-script { animation-delay: .12s; }
  .intro .hero > .hero-about { animation-delay: .18s; }
  .intro .hero > .hero-btn { animation-delay: .24s; }
  .intro .near { animation: rise .8s .3s var(--ease) both; }

  /* Ближайшие окошки: белая карточка наезжает на фото */
  .near { position: relative; z-index: 2; margin: -48px 12px 0; padding: 16px; border-radius: 24px; background: var(--card); box-shadow: 0 24px 48px -20px rgba(20, 26, 60, .3); }
  .near-label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .near-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .near-slot { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 12px; border-radius: 16px; background: var(--soft); text-align: left; transition: transform .15s var(--ease); }
  .near-slot:active { transform: scale(.97); }
  .near-slot small { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .near-slot b { margin: 4px 0 2px; color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1 var(--title); font-variant-numeric: lining-nums tabular-nums; }
  .near-slot span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .sec { padding: 48px 20px; }
  .rose { background: var(--soft); }
  /* Тёмный блок: чередуем светлые и тёмные, как в примере */
  .sec.deep { background: var(--ink); color: var(--on-ink); }
  .deep .ttl { color: #fff; }
  .deep .ttl i { color: color-mix(in srgb, var(--mark) 60%, #fff); }

  /* Появление блоков при прокрутке */
  .reveal .sec, .reveal .foot { opacity: 0; transform: translateY(24px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal .seen { opacity: 1; transform: none; }

  /* Ближайшая запись на главной */
  .next { display: flex; gap: 12px; align-items: center; width: calc(100% - 40px); margin: 20px 20px 0; padding: 12px; text-align: left; border-radius: 12px; background: var(--card); }
  .next img { flex: none; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: center 15%; }
  .next b { display: block; font-size: 16px; font-weight: 600; }
  .next span { font-size: 14px; color: var(--muted); }

  /* Плитки услуг: одна высокая, две рядом, одна широкая */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: 100%; min-height: 148px; padding: 16px; border-radius: 12px; background: var(--soft); color: var(--ink); text-align: left; transition: background .25s, color .25s; }
  .tile:first-child { grid-row: span 2; }
  .tile:first-child b { font-size: calc(28px * var(--t)); }
  .tile:last-child { grid-column: 1 / -1; min-height: 132px; flex-direction: row; align-items: flex-end; justify-content: space-between; }
  .tile b { display: block; font: var(--title-weight) calc(20px * var(--t))/1.1 var(--title); hyphens: auto; overflow-wrap: break-word; }
  .tile small { display: block; margin-top: 4px; color: var(--text); font-size: 14px; transition: color .25s; }
  .tile .almond { position: absolute; right: 16px; top: 16px; transition: transform .3s var(--ease); }
  .tile.on { background: var(--ink); color: var(--on-ink); }
  .tile.on small { color: var(--on-ink); }
  .tile.on .almond { transform: rotate(180deg); }
  .deep .tile { background: rgba(255, 255, 255, .09); color: #fff; }
  .deep .tile small { color: rgba(255, 255, 255, .72); }
  .deep .tile.on { background: #fff; color: var(--ink); }
  .deep .tile.on small { color: var(--muted); }
  /* Фото в плитке уже обрезано так, что ногти крупно в верхней части; затемнение только под текстом */
  .tile.pic { isolation: isolate; overflow: hidden; background: var(--ink) var(--pic) var(--pos, center top) / var(--size, cover) no-repeat; }
  .tile.pic::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 52%, color-mix(in srgb, var(--ink) 85%, transparent) 100%); }
  /* Широкая плитка: фото справа целиком, текст слева на синем */
  /* Высокая плитка: фото чуть отдалено, чтобы были видны обе руки, снизу растворяется в синем под текстом */
  .tile.pic:first-child, .deep .tile.pic.on:first-child { background: color-mix(in srgb, #fff 9%, var(--ink)); }
  .tile.pic:first-child::before { content: none; }
  .tile.pic:first-child::after { content: ""; position: absolute; inset: 0 0 auto; height: 86%; z-index: -2; background: var(--pic) center top / cover no-repeat; -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent); mask-image: linear-gradient(180deg, #000 62%, transparent); }
  .tile.pic:last-child, .deep .tile.pic.on:last-child { background: color-mix(in srgb, #fff 9%, var(--ink)); }
  .tile.pic:last-child::before { left: auto; aspect-ratio: 600 / 383; background: var(--pic) center / cover; -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%); mask-image: linear-gradient(90deg, transparent, #000 50%); }
  .deep .tile.pic.on { background: var(--ink) var(--pic) var(--pos, center top) / var(--size, cover) no-repeat; color: #fff; box-shadow: inset 0 0 0 2px #fff; }
  .deep .tile.pic.on small { color: rgba(255, 255, 255, .8); }

  /* Прайс шахматкой */
  .price { margin-top: 20px; scroll-margin-top: 64px; overflow: hidden; border-radius: 12px; background: var(--card); }
  .price[hidden] { display: none; }
  .price-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px; }
  .price-head h3 { color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1.1 var(--title); }
  .price-head button { min-height: 32px; color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1.7fr; border-top: 4px solid var(--bg); }
  .row-num { display: flex; align-items: center; justify-content: center; min-height: 136px; background: var(--soft); color: var(--ink); font: var(--title-weight) calc(40px * var(--t))/1 var(--title); font-variant-numeric: lining-nums; }
  .row:nth-of-type(even) { grid-template-columns: 1.7fr 1fr; }
  .row:nth-of-type(even) .row-num { order: 2; }
  .row-text { display: flex; flex-direction: column; padding: 16px; }
  .row-text b { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row-text p { margin: 4px 0 12px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .row-price { margin-top: auto; color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1 var(--title); font-variant-numeric: lining-nums; text-align: right; }

  /* Студия в арке */
  .arch { width: 100%; aspect-ratio: 1 / 1.08; margin-bottom: 16px; object-fit: cover; object-position: center 45%; border-radius: 999px 999px 24px 24px; }

  /* Полоса: бегущая строка наезжает на фото, поверх стеклянная карточка */
  .strip { position: relative; isolation: isolate; padding: 0 0 32px; overflow: hidden; }
  .strip-run { display: flex; width: max-content; color: var(--ink); font: var(--title-weight) calc(72px * var(--t))/1 var(--title); text-transform: uppercase; white-space: nowrap; animation: run 28s linear infinite; position: relative; z-index: 1; margin-bottom: -.22em; }
  .strip-run span { padding-right: .5em; }
  @keyframes run { to { transform: translateX(-50%); } }
  .strip-pic { height: 400px; margin: 0; background: var(--soft) var(--pic) center 78% / cover; filter: saturate(.75); }
  .glass { background: rgba(255, 255, 255, .58); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5), 0 20px 40px -24px rgba(20, 26, 60, .35); }
  .strip-card { position: relative; margin: -132px 20px 0; padding: 20px; border-radius: 24px; }
  .strip-card b { display: block; color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1.15 var(--title); }
  .strip-card p { margin: 8px 0 16px; color: var(--text); font-size: 16px; }

  /* Почему выбирают */
  .why { display: grid; gap: 8px; }
  .why div { display: grid; gap: 4px; padding: 16px; border-radius: 12px; background: var(--card); }
  .why .almond { margin: 4px 0 8px; }
  .why b { font-size: 16px; font-weight: 600; }
  .why p { color: var(--muted); font-size: 14px; line-height: 1.45; }

  /* Мастера: две карточки с высоким фото, под ними рассказ о выбранном */
  .crew { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .crew-card { min-width: 0; text-align: left; scroll-margin-top: 64px; }
  .crew-pic { display: block; overflow: hidden; aspect-ratio: 3 / 4; border-radius: 20px; background: var(--card); transition: box-shadow .25s var(--ease); }
  .crew-pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; transition: transform .5s var(--ease); }
  .crew-card:active .crew-pic img { transform: scale(1.03); }
  .crew-card.on .crew-pic { box-shadow: 0 0 0 2px var(--soft), 0 0 0 4px var(--ink); }
  .crew-card b { display: block; margin-top: 12px; color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1.1 var(--title); }
  .crew-card small { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 14px; }
  .crew-card small i { color: var(--ink); font-style: normal; font-size: 20px; line-height: 1; transition: transform .25s var(--ease); }
  .crew-card.on small i { transform: rotate(45deg); }
  .crew-detail:not(:empty) { margin-top: 16px; padding: 20px; border-radius: 20px; background: var(--card); animation: rise .4s var(--ease); scroll-margin-top: 64px; }
  .crew-detail h3 { color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1.1 var(--title); }
  .crew-detail p { margin-top: 8px; font-size: 16px; }
  .crew-detail .can { margin-bottom: 4px; color: var(--muted); font-size: 14px; }
  .crew-detail .btn { margin-top: 16px; }

  /* Мастера: строка раскрывается, внутри описание и работы этого мастера */
  .masters { display: grid; gap: 8px; }
  .master { border-radius: 12px; background: var(--card); }
  .master-row { display: grid; grid-template-columns: 64px 1fr 20px; gap: 12px; align-items: center; width: 100%; min-height: 88px; padding: 12px 16px 12px 12px; text-align: left; scroll-margin-top: 56px; }
  .master-row img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; object-position: center 12%; }
  .master-row b { display: block; color: var(--ink); font: var(--title-weight) calc(24px * var(--t))/1.1 var(--title); }
  .master-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }
  .plus { color: var(--ink); font-size: 24px; line-height: 1; transition: transform .25s var(--ease); }
  .master.open .plus, details[open] > summary .plus { transform: rotate(45deg); }
  .master-body { display: none; padding: 0 16px 16px; }

/* ---------- Даты: храним строкой 2026-11-05, считаем в местном времени ---------- */
const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_OF = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const WEEK = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const WEEK_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const pad = n => String(n).padStart(2, "0");
const toKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromKey = key => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => toKey(new Date());
const addDays = (key, n) => { const d = fromKey(key); d.setDate(d.getDate() + n); return toKey(d); };
const dayNum = key => Math.round(fromKey(key).getTime() / 864e5);
const dateText = key => { const d = fromKey(key); return d.getDate() + " " + MONTHS_OF[d.getMonth()]; };
const dateFull = key => WEEK[fromKey(key).getDay()] + ", " + dateText(key);
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const toTime = min => pad(Math.floor(min / 60)) + ":" + pad(min % 60);

/* ---------- Данные. В настоящей версии этот блок заменяют обращения к серверу, экраны остаются те же ---------- */
let db = null;

function defaultDb() {
  const schedules = {};
  CONFIG.masters.forEach(m => { schedules[m.id] = Object.assign({}, m.schedule); });
  return { range: CONFIG.startRange, schedules, overrides: {}, bookings: [], seededUntil: null, next: 1 };
}
function saveDb() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(db)); } catch (e) {}
}
function loadDb() {
  try { db = JSON.parse(localStorage.getItem(CONFIG.storageKey)); } catch (e) { db = null; }
  const fresh = !db || !db.schedules;
  if (fresh) db = defaultDb();
  seedBookings(fresh);
  saveDb();
}

// Простое стабильное «случайное» число, чтобы календарь выглядел живым
function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function samplePhone(h) {
  return "+7 (900) 000-" + pad(h % 90 + 10) + "-" + pad((h >> 5) % 90 + 10);
}
// Показываем чужие записи, чтобы часть окошек уже была занята. Подальше в будущем их меньше, как в жизни
function seedBookings(fresh) {
  const today = todayKey();
  db.bookings = db.bookings.filter(b => b.source !== "sample" || b.date >= today);
  const start = db.seededUntil && db.seededUntil >= today ? addDays(db.seededUntil, 1) : today;
  const end = addDays(today, CONFIG.adminRange);
  for (let key = start; key <= end; key = addDays(key, 1)) {
    const far = dayNum(key) - dayNum(today);
    CONFIG.masters.forEach(m => {
      templateTimes(m.id, key).forEach(time => {
        const h = hash(key + m.id + time);
        if (h % 100 < Math.max(6, 48 - far * 1.5)) addSample(key, m.id, time, h, "confirmed");
      });
    });
  }
  db.seededUntil = end;
  if (fresh) addFirstRequests(today);
}
function addSample(date, master, time, h, status) {
  const names = CONFIG.sampleClients;
  db.bookings.push({ id: db.next++, date, master, time, status, source: "sample", name: names[h % names.length], phone: samplePhone(h), at: Date.now() - (h % 720) * 6e4 });
}
// Две заявки ждут ответа, чтобы у администратора сразу было что нажать
function addFirstRequests(today) {
  let left = 2;
  for (let n = 1; n < 14 && left; n++) {
    const key = addDays(today, n);
    CONFIG.masters.forEach(m => {
      if (!left) return;
      const free = dayTimes(m.id, key).filter(t => !activeBooking(m.id, key, t));
      if (free.length) { addSample(key, m.id, free[free.length - 1], hash(key + m.id) + left, "pending"); left--; }
    });
  }
}

function genTimes(s) {
  const out = [];
  if (!s.step || s.step < 15) return out;
  for (let t = toMin(s.from); t + s.step <= toMin(s.to); t += s.step) out.push(toTime(t));
  return out;
}
function templateTimes(masterId, key) {
  const s = db.schedules[masterId];
  return s.days.includes(fromKey(key).getDay()) ? genTimes(s) : [];
}
function override(masterId, key, create) {
  const day = db.overrides[key];
  if (!create) return (day && day[masterId]) || { off: false, add: [], del: [] };
  if (!db.overrides[key]) db.overrides[key] = {};
  if (!db.overrides[key][masterId]) db.overrides[key][masterId] = { off: false, add: [], del: [] };
  return db.overrides[key][masterId];
}
const isActive = b => b.status === "pending" || b.status === "confirmed";
const activeBooking = (masterId, key, time) => db.bookings.find(b => isActive(b) && b.master === masterId && b.date === key && b.time === time);
const dayBookings = (masterId, key) => db.bookings.filter(b => isActive(b) && b.master === masterId && b.date === key);

// Окошки дня = шаблон мастера, плюс добавленные вручную, минус убранные. Занятое время остаётся видно в любом случае
function dayTimes(masterId, key) {
  const ov = override(masterId, key);
  const set = new Set();
  if (!ov.off) {
    templateTimes(masterId, key).forEach(t => set.add(t));
    ov.add.forEach(t => set.add(t));
    ov.del.forEach(t => set.delete(t));
  }
  dayBookings(masterId, key).forEach(b => set.add(b.time));
  return [...set].sort();
}
function isPast(key, time) {
  const today = todayKey();
  if (key !== today) return key < today;
  const now = new Date();
  return toMin(time) <= now.getHours() * 60 + now.getMinutes();
}
const clientTimes = (masterId, key) => dayTimes(masterId, key).filter(t => !isPast(key, t));
const freeCount = key => CONFIG.masters.reduce((sum, m) => sum + clientTimes(m.id, key).filter(t => !activeBooking(m.id, key, t)).length, 0);
const bookable = key => key >= todayKey() && dayNum(key) - dayNum(todayKey()) < db.range && freeCount(key) > 0;

function createBooking(fields) {
  const b = Object.assign({ id: db.next++, at: Date.now() }, fields);
  db.bookings.push(b);
  saveDb();
  return b;
}
function setStatus(id, status) {
  const b = db.bookings.find(x => x.id === id);
  if (!b) return null;
  b.status = status;
  if (b.source === "client") b.fresh = status;   // клиент увидит сообщение бота, когда вернётся
  saveDb();
  return b;
}

// Шапка при прокрутке: название уплывает влево, фото чуть отстаёт
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function heroDrift() {
  const name = app.querySelector(".hero h1"), pic = app.querySelector(".hero-pic img");
  if (!name || calm.matches) return;
  const y = Math.min(window.scrollY, 900);
  name.style.transform = `translateX(${(-y * .4).toFixed(1)}px)`;
  pic.style.transform = `translateY(${(y * .3).toFixed(1)}px) scale(1.04)`;
}
let driftQueued = false;
window.addEventListener("scroll", () => {
  if (driftQueued) return;
  driftQueued = true;
  requestAnimationFrame(() => { driftQueued = false; heroDrift(); });
}, { passive: true });
// Ближайшие свободные окошки: можно записаться прямо с первого экрана
function nearSlots(n = 3) {
  const out = [];
  const today = todayKey();
  for (let i = 0; i < db.range && out.length < n; i++) {
    const key = addDays(today, i);
    const day = [];
    CONFIG.masters.forEach(m => clientTimes(m.id, key).forEach(t => { if (!activeBooking(m.id, key, t)) day.push({ key, t, m, i }); }));
    day.sort((x, y) => x.t.localeCompare(y.t)).forEach(x => { if (out.length < n) out.push(x); });
  }
  return out;
}
function nearHtml() {
  const list = nearSlots();
  if (!list.length) return "";
  const label = x => x.i === 0 ? "Сегодня" : x.i === 1 ? "Завтра" : WEEK[fromKey(x.key).getDay()] + ", " + dateText(x.key);
  return `<div class="near">
    <p class="near-label">${ALMOND}Ближайшие свободные окошки</p>
    <div class="near-row">${list.map(x => `<button class="near-slot" data-act="pick-slot" data-date="${x.key}" data-master="${x.m.id}" data-time="${x.t}">
      <small>${label(x)}</small><b>${x.t}</b><span>${esc(x.m.short)}</span></button>`).join("")}</div>
  </div>`;
}

// Блоки ниже баннера проявляются, когда до них доходит прокрутка
let revealWatch = null;
function revealSections() {
  if (revealWatch) revealWatch.disconnect();
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = app.querySelector(".has-sticky");
  wrap.classList.add("reveal");
  revealWatch = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("seen"); revealWatch.unobserve(e.target); }
  }), { rootMargin: "0px 0px -10% 0px" });
  wrap.querySelectorAll(".sec, .foot").forEach(el => revealWatch.observe(el));
}

  const sticky = app.querySelector(".sticky");

    sticky.hidden = e.isIntersecting;

}

function firstBookable() {
  const today = todayKey();
  for (let n = 0; n < db.range; n++) { const key = addDays(today, n); if (bookable(key)) return key; }
  return null;
}
function calendarHtml(selected, canPick, lastKey) {
  const { y, m } = calMonth;
  const first = new Date(y, m, 1);
  const count = new Date(y, m + 1, 0).getDate();
  const shift = (first.getDay() + 6) % 7;
  const today = todayKey();
  const prevOk = toKey(new Date(y, m, 0)) >= today;
  const nextOk = toKey(new Date(y, m + 1, 1)) <= lastKey;
  let cells = "";
  for (let i = 0; i < shift; i++) cells += '<span class="day empty"></span>';
  for (let d = 1; d <= count; d++) {
    const key = toKey(new Date(y, m, d));
    const ok = canPick(key);
    cells += `<button class="day ${key === today ? "today" : ""} ${key === selected ? "sel" : ""}" data-act="pick-day" data-key="${key}" ${ok ? "" : "disabled"}>${d}${ok && freeCount(key) ? "<i></i>" : ""}</button>`;
  }
  return `<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" data-act="month" data-dir="-1" ${prevOk ? "" : "disabled"} aria-label="Назад">‹</button>
      <b>${MONTHS[m][0].toUpperCase() + MONTHS[m].slice(1)}</b>
      <button class="cal-nav" data-act="month" data-dir="1" ${nextOk ? "" : "disabled"} aria-label="Вперёд">›</button>
    </div>
    <div class="cal-grid">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(w => `<small>${w}</small>`).join("")}${cells}</div>
  </div>`;
}

function formatPhone(value) {
  let d = value.replace(/\D/g, "");
  if (!d) return "";
  if (d[0] === "8") d = "7" + d.slice(1);
  if (d[0] !== "7") d = "7" + d;
  d = d.slice(0, 11);
  let out = "+7";
  if (d.length > 1) out += " (" + d.slice(1, 4);
  if (d.length >= 4) out += ")";
  if (d.length > 4) out += " " + d.slice(4, 7);
  if (d.length > 7) out += "-" + d.slice(7, 9);
  if (d.length > 9) out += "-" + d.slice(9, 11);
  return out;
}

        <button data-act="reject" data-id="${b.id}">Отклонить</button>
        <button class="wide" data-act="write" data-id="${b.id}">Написать клиенту</button>
      </div>`).join("")}</div>` : `<p class="empty-text">Новых заявок нет. Запишитесь со стороны клиента, и она появится здесь.</p>`}

    ${handled.length ? `<h2>Уже ответили</h2><div class="list">${handled.map(b => `<div class="li"><div><b>${esc(b.name)}</b><small>${esc(dateFull(b.date))}, ${b.time}, ${esc(MASTER[b.master].short)}</small></div><div class="r"><small>${STATUS[b.status][0]}</small></div></div>`).join("")}</div>` : ""}

    <h2>Ближайшие записи</h2>
    <div class="list">${soon.map(b => `<a href="tel:${esc(b.phone.replace(/[^+\d]/g, ""))}"><div><b>${esc(dateFull(b.date))}, ${b.time}</b><small>${esc(MASTER[b.master].short)}</small></div><div class="r"><b>${esc(b.name)}</b><small>${esc(b.phone)}</small></div></a>`).join("")}</div>`);
}

function renderSlots() {
  const today = todayKey();
  if (!adminDate || adminDate < today) adminDate = today;
  if (!calMonth) setCalMonth(adminDate);
  const last = addDays(today, CONFIG.adminRange);
  adminFrame("slots", `
    <p style="margin:0 0 12px">Выберите день. Нажмите на окошко, чтобы убрать его или записать человека, который позвонил по телефону.</p>
    ${calendarHtml(adminDate, key => key >= today && key <= last, last)}
    <h2 class="day-title">${WEEK_FULL[fromKey(adminDate).getDay()][0].toUpperCase() + WEEK_FULL[fromKey(adminDate).getDay()].slice(1)}, ${dateText(adminDate)}</h2>
    ${CONFIG.masters.map(m => adminBox(m, adminDate)).join("")}
    <div class="legend"><span><i style="background:var(--ink)"></i>записан</span><span><i style="background:var(--gold)"></i>ждёт ответа</span><span><i style="background:var(--soft)"></i>свободно</span></div>`);
}
function adminBox(m, key) {
  const ov = override(m.id, key);
  const times = [...new Set([...dayTimes(m.id, key), ...(ov.off ? [] : ov.del.filter(t => templateTimes(m.id, key).includes(t)))])].sort();
  return `<section class="box">
    <div class="box-head"><img src="${m.photo}" alt=""><div><b>${esc(m.short)}</b><small>${esc(m.rank)}</small></div>
      <button class="toggle ${ov.off ? "on" : ""}" data-act="day-off" data-master="${m.id}">${ov.off ? "Выходной" : "Сделать выходным"}</button>
    </div>
    <div class="a-slots">
      ${times.map(t => adminSlot(m, key, t, ov)).join("")}
      <button class="a-slot add" data-act="add-slot" data-master="${m.id}">+ добавить время</button>
    </div>
  </section>`;
}
function adminSlot(m, key, t, ov) {
  const b = activeBooking(m.id, key, t);
  if (b) return `<button class="a-slot ${b.status === "pending" ? "wait" : "busy"}" data-act="slot-info" data-id="${b.id}">${t}<small>${esc(b.name)}</small></button>`;
  if (ov.del.includes(t)) return `<button class="a-slot gone" data-act="slot-back" data-master="${m.id}" data-time="${t}">${t}<small>убрано</small></button>`;
  return `<button class="a-slot" data-act="slot-menu" data-master="${m.id}" data-time="${t}">${t}<small>свободно</small></button>`;
}

function renderWeek() {
  const dayOrder = [1, 2, 3, 4, 5, 6, 0];
  adminFrame("week", `
    <h2>На сколько вперёд открыта запись</h2>
    <p>Календарь сдвигается сам: каждое утро появляется новый день. Вручную открывать окошки на следующую неделю или месяц не нужно.</p>
    <div class="segs">${[[7, "Неделя"], [14, "Две недели"], [30, "Месяц"]].map(([n, t]) => `<button data-act="range" data-n="${n}" class="${db.range === n ? "on" : ""}">${t}</button>`).join("")}</div>

    <h2>График мастеров</h2>
    <p>Из этого графика окошки появляются на все дни вперёд. Разовые изменения, например больничный или лишнее время в субботу, делаются на вкладке «Окошки».</p>
    ${CONFIG.masters.map(m => {
      const s = db.schedules[m.id];
      const times = genTimes(s);
      return `<section class="box">
        <div class="box-head"><img src="${m.photo}" alt=""><div><b>${esc(m.short)}</b><small>${esc(m.rank)}</small></div></div>
        <div class="weekdays">${dayOrder.map(d => `<button data-act="week-day" data-master="${m.id}" data-day="${d}" class="${s.days.includes(d) ? "on" : ""}">${WEEK[d]}</button>`).join("")}</div>
        <div class="row3">
          <label class="field"><span>С</span><input type="time" data-sched="from" data-master="${m.id}" value="${s.from}"></label>
          <label class="field"><span>До</span><input type="time" data-sched="to" data-master="${m.id}" value="${s.to}"></label>
          <label class="field"><span>Каждые</span><select data-sched="step" data-master="${m.id}">${[[60, "1 час"], [90, "1,5 часа"], [120, "2 часа"], [150, "2,5 часа"], [180, "3 часа"]].map(([v, t]) => `<option value="${v}" ${s.step === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        </div>
        <p class="preview">${times.length ? "Окошки: " + times.join(", ") : "С такими часами окошек не получится"}</p>
      </section>`;
    }).join("")}
    ${CONFIG.demo ? `<button class="reset" data-act="reset">Вернуть пример к началу</button>` : ""}`);
}

/* ---------- Всплывающие окна администратора ---------- */
function openLayer(html) {
  layer.innerHTML = html;
  syncBackButton();
}
function closeLayer() {
  layer.innerHTML = "";
  syncBackButton();
}
function slotMenu(masterId, time) {
  const m = MASTER[masterId];
  openLayer(`<div class="overlay" data-act="close-layer"><div class="pop">
    <h2>${esc(dateFull(adminDate))}, ${time}</h2>
    <p>${esc(m.short)}, окошко свободно</p>
    <button class="btn" data-act="phone-form" data-master="${masterId}" data-time="${time}">Записать клиента</button>
    <button class="btn soft" data-act="slot-remove" data-master="${masterId}" data-time="${time}">Убрать окошко</button>
  </div></div>`);
}
function phoneForm(masterId, time) {
  openLayer(`<div class="overlay" data-act="close-layer"><div class="pop">
    <h2>Запись по телефону</h2>
    <p>${esc(MASTER[masterId].short)}, ${esc(dateFull(adminDate))}, ${time}. Окошко сразу станет занятым.</p>
    <label class="field"><span>Имя</span><input id="p-name" placeholder="Имя"></label>
    <label class="field"><span>Телефон</span><input id="p-phone" type="tel" inputmode="tel" placeholder="+7 (___) ___-__-__"></label>
    <div class="err" id="p-err" style="margin-top:9px"></div>
    <button class="btn" data-act="phone-save" data-master="${masterId}" data-time="${time}">Записать</button>
  </div></div>`);
}
function bookingInfo(id) {
  const b = db.bookings.find(x => x.id === id);
  if (!b) return;
  const m = MASTER[b.master];
  openLayer(`<div class="overlay" data-act="close-layer"><div class="pop">
    <h2>${esc(dateFull(b.date))}, ${b.time}</h2>
    <div class="rows">
      <div><span>Клиент</span><b>${esc(b.name)}</b></div>
      <div><span>Телефон</span><b>${esc(b.phone)}</b></div>
      <div><span>Мастер</span><b>${esc(m.short)}</b></div>
      <div><span>Статус</span><b>${STATUS[b.status][0]}</b></div>
    </div>
    ${b.status === "pending" ? `<button class="btn" data-act="confirm" data-id="${b.id}">Подтвердить</button>` : ""}
    <a class="btn soft" href="tel:${esc(b.phone.replace(/[^+\d]/g, ""))}">Позвонить</a>
    <button class="btn soft" data-act="admin-cancel" data-id="${b.id}">Отменить запись</button>
  </div></div>`);
}
function addSlotForm(masterId) {
  openLayer(`<div class="overlay" data-act="close-layer"><div class="pop">
    <h2>Новое окошко</h2>
    <p>${esc(MASTER[masterId].short)}, ${esc(dateFull(adminDate))}</p>
    <label class="field"><span>Время</span><input id="a-time" type="time" value="12:00"></label>
    <button class="btn" data-act="add-save" data-master="${masterId}">Добавить</button>
  </div></div>`);
}

/* ---------- Переходы и кнопки Telegram ---------- */
let mainAction = null;
function setMainButton(text, action) {
  mainAction = action || null;
  if (heroWatch) { heroWatch.disconnect(); heroWatch = null; }
  if (!inTelegram) return;
  if (text) { tg.MainButton.setText(text); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
function go(hash) {
  haptic();
  if (location.hash === hash || (hash === "#" && !location.hash)) route();
  else location.hash = hash;
}
const PARENT = { "#book": "#", "#form": "#book", "#my": "#", "#done": "#" };
function syncBackButton() {
  if (!inTelegram) return;
  if (layer.innerHTML || PARENT[location.hash]) tg.BackButton.show();
  else tg.BackButton.hide();
}
function renderCurrent() {
  const h = location.hash;
  if (h === "#admin") renderRequests();
  else if (h === "#admin/slots") renderSlots();
  else if (h === "#admin/week") renderWeek();
  else if (h === "#book") renderBook();
  else if (h === "#form") renderForm();
  else if (h === "#done") renderDone();
  else if (h === "#my") renderMy();
  else renderHome();
}
function route() {
  closeLayer();
  calMonth = null;
  renderCurrent();
  syncBackButton();
  if (!location.hash.startsWith("#admin") && location.hash !== "#done") tellFresh();
  scrollTo(0, 0);
}

/* ---------- Нажатия ---------- */
const ACTIONS = {
  go: el => go(el.dataset.to),
  "toggle-master": el => {
    openMaster = openMaster === el.dataset.id ? null : el.dataset.id;
    haptic();
    app.querySelectorAll(".crew-card").forEach(card => { const on = card.dataset.id === openMaster; card.classList.toggle("on", on); card.setAttribute("aria-expanded", on); });
    const box = app.querySelector("#crew-detail");
    box.innerHTML = openMaster ? masterDetail(MASTER[openMaster]) : "";
    if (openMaster) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
  },
  tile: el => { haptic(); openPrice(el.dataset.id); },
  "close-price": () => closePrice(),
  photo: el => openLayer(`<div class="lightbox" data-act="close-layer"><img src="${el.dataset.src}" alt=""></div>`),
  month: el => {
    const d = new Date(calMonth.y, calMonth.m + Number(el.dataset.dir), 1);
    calMonth = { y: d.getFullYear(), m: d.getMonth() };
    haptic();
    renderCurrent();
  },
  "pick-day": el => {
    haptic();
    if (location.hash === "#admin/slots") adminDate = el.dataset.key;
    else selDate = el.dataset.key;
    renderCurrent();
  },
  "pick-slot": el => {
    if (el.dataset.date) selDate = el.dataset.date;
    pick = { date: selDate, time: el.dataset.time, master: el.dataset.master };
    go("#form");
  },
  "close-layer": (el, e) => { if (e.target === el || el.tagName === "BUTTON" || el.classList.contains("lightbox")) closeLayer(); },
  send: () => sendBooking(),
  "my-cancel": el => {
    setStatus(Number(el.dataset.id), "cancelled");
    delete db.bookings.find(b => b.id === Number(el.dataset.id)).fresh;
    saveDb();
    showNotice("Запись отменена, окошко снова свободно");
    renderCurrent();
  },
  confirm: el => {
    haptic("medium");
    const b = setStatus(Number(el.dataset.id), "confirmed");
    closeLayer();
    showNotice(b.name + " получит сообщение, что запись подтверждена");
    renderCurrent();
  },
  reject: el => {
    haptic("medium");
    const b = setStatus(Number(el.dataset.id), "rejected");
    showNotice("Окошко снова свободно. " + b.name + " получит сообщение");
    renderCurrent();
  },
  write: el => {
    const b = db.bookings.find(x => x.id === Number(el.dataset.id));
    showNotice("В настоящем боте откроется чат с клиентом: " + (b ? b.name : ""));
  },
  "slot-info": el => bookingInfo(Number(el.dataset.id)),
  "slot-menu": el => slotMenu(el.dataset.master, el.dataset.time),
  "slot-back": el => {
    const ov = override(el.dataset.master, adminDate, true);
    ov.del = ov.del.filter(t => t !== el.dataset.time);
    saveDb();
    renderCurrent();
  },
  "slot-remove": el => {
    const ov = override(el.dataset.master, adminDate, true);
    const t = el.dataset.time;
    if (ov.add.includes(t)) ov.add = ov.add.filter(x => x !== t);
    if (templateTimes(el.dataset.master, adminDate).includes(t)) ov.del.push(t);
    saveDb();
    closeLayer();
    renderCurrent();
  },
  "phone-form": el => phoneForm(el.dataset.master, el.dataset.time),
  "phone-save": el => {
    const name = document.getElementById("p-name").value.trim();
    const phone = document.getElementById("p-phone").value.trim();
    if (name.length < 2 || !phoneOk(phone)) { document.getElementById("p-err").textContent = "Проверьте имя и телефон"; return; }
    createBooking({ date: adminDate, time: el.dataset.time, master: el.dataset.master, name, phone, status: "confirmed", source: "admin" });
    closeLayer();
    renderCurrent();
  },
  "admin-cancel": el => {
    const b = db.bookings.find(x => x.id === Number(el.dataset.id));
    setStatus(b.id, "cancelled");
    closeLayer();
    showNotice("Запись отменена, окошко снова свободно");
    renderCurrent();
  },
  "add-slot": el => addSlotForm(el.dataset.master),
  "add-save": el => {
    const t = document.getElementById("a-time").value;
    if (!t) return;
    const master = el.dataset.master;
    const ov = override(master, adminDate, true);
    if (dayTimes(master, adminDate).includes(t)) { showNotice("Такое время уже есть"); return; }
    ov.del = ov.del.filter(x => x !== t);
    if (!templateTimes(master, adminDate).includes(t)) ov.add.push(t);
    saveDb();
    closeLayer();
    renderCurrent();
  },
  "day-off": el => {
    const master = el.dataset.master;
    const ov = override(master, adminDate, true);
    ov.off = !ov.off;
    saveDb();
    if (ov.off && dayBookings(master, adminDate).length) showNotice("На этот день уже есть записи, они остались. Новых не будет");
    renderCurrent();
  },
  range: el => {
    db.range = Number(el.dataset.n);
    saveDb();
    renderCurrent();
  },
  "week-day": el => {
    const s = db.schedules[el.dataset.master];
    const d = Number(el.dataset.day);
    s.days = s.days.includes(d) ? s.days.filter(x => x !== d) : [...s.days, d];
    saveDb();
    renderCurrent();
  },
  reset: () => {
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
    db = null;
    selDate = adminDate = pick = null;
    draft = { name: "", phone: "", agree: false };
    loadDb();
    showNotice("Пример вернулся к началу");
    go("#");
  },
};

function bindEvents() {
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el, e);
  });
  document.addEventListener("input", e => {
    if (e.target.id === "f-phone" || e.target.id === "p-phone") e.target.value = formatPhone(e.target.value);
    if (e.target.id === "f-name") draft.name = e.target.value;
    if (e.target.id === "f-phone") draft.phone = e.target.value;
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "f-agree") draft.agree = el.checked;
    if (!el.dataset.sched) return;
    const s = db.schedules[el.dataset.master];
    if (el.dataset.sched === "step") s.step = Number(el.value);
    else if (el.value) s[el.dataset.sched] = el.value;
    saveDb();
    renderCurrent();
  });
  app.addEventListener("submit", e => {
    e.preventDefault();
    submitForm();
  });
  window.addEventListener("hashchange", route);
  if (inTelegram) {
    tg.MainButton.onClick(() => { if (mainAction) mainAction(); });
    tg.BackButton.onClick(() => {
      if (layer.innerHTML) { closeLayer(); return; }
      go(PARENT[location.hash] || "#");
    });
  }
}

loadDb();
bindEvents();
route();
</script>
</body>
</html>
