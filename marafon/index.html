<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Лёгкая неделя · марафон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Цвета марафона — меняйте здесь */
    --bg: #F4F0E6;                     /* кремовый фон */
    --card: #FFFDF8;
    --deep: #1B2619;                   /* самый тёмный оливковый, им же красится шапка Telegram */
    --olive: #2E3D2A;
    --sage: #66755A;
    --text: #1F2A1E;
    --about: #414C3E;
    --muted: #727C6C;
    --line: rgba(46, 61, 42, .12);
    --lime: #C9DC6B;                   /* акцент */
    --lime-soft: #E4EBBD;
    --veg: #7DA45F;                    /* части тарелки */
    --protein: #D98A52;
    --carb: #E2B84F;
    --fat: #A8A85C;
    --main-btn: #2E3D2A;               /* цвет родной кнопки Telegram (только сплошной цвет) */
    --serif: "Cormorant Garamond", Georgia, serif;
    --script: "Marck Script", cursive;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    color: var(--text); background: var(--bg);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; min-height: 100vh; overflow-x: hidden; font-variant-numeric: lining-nums;
  }
  #app { position: relative; max-width: 560px; min-height: 100vh; margin: 0 auto; overflow-x: clip; background: var(--bg); }
  button, input { font-family: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  .loading { padding-top: 42vh; text-align: center; color: var(--muted); }
  .in-tg .browser-only { display: none; }

  /* Появление блоков */
  .rise { opacity: 0; animation: rise .8s var(--ease) forwards; animation-delay: var(--d, 0s); }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  .btn { display: block; width: 100%; padding: 16px; border-radius: 18px; background: var(--olive); color: #fff; font-size: 15px; font-weight: 700; text-align: center; transition: transform .2s var(--ease); }
  .btn:active { transform: scale(.98); }
  .btn.lime { background: var(--lime); color: var(--deep); }
  .btn.ghost { background: var(--lime-soft); color: var(--olive); }
  .link { display: block; margin: 12px auto 0; font-size: 13.5px; font-weight: 700; color: var(--olive); border-bottom: 1.5px solid var(--lime); }
  .note { margin-top: 20px; font-size: 12px; text-align: center; color: var(--muted); }
  .hand { font-family: var(--script); font-size: 27px; line-height: 1.2; color: var(--lime); }
  .gate .hand, .hero-home .hand { font-size: 24px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--lime); }
  .glass { background: rgba(255, 255, 255, .11); border: 1px solid rgba(255, 255, 255, .24); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .round { position: absolute; left: 16px; top: 16px; z-index: 4; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--text); box-shadow: 0 6px 16px rgba(46, 61, 42, .16); font-size: 19px; }

  /* Тёмные шапки: крупные листья */
  .hero { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 26px 20px 58px; color: #fff; background: var(--deep); }
  .hero-bg { position: absolute; inset: -4%; background: url(img/leaves.webp) center 30% / cover; animation: slowzoom 22s ease-in-out infinite alternate; }
  @keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.1) translateY(-8px); } }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 29, 18, .35) 0%, rgba(20, 29, 18, .2) 40%, rgba(20, 29, 18, .85) 100%); }
  .hero > *:not(.hero-bg):not(.round) { position: relative; z-index: 1; }
  .hero-day { min-height: 468px; }
  .hero-home { min-height: 430px; }
  .hero-text { margin-top: auto; padding-top: 70px; }
  .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 46px; line-height: .98; margin: 10px 0 2px; }
  .hero-home h1 { font-size: 56px; }
  .in-tg .hero-day .hero-text { padding-top: 30px; }

  /* Отрезки прогресса: по одному на день */
  .segs { display: flex; gap: 4px; margin-top: 14px; }
  .segs i { display: block; flex: 1; height: 5px; border-radius: 9px; background: rgba(255, 255, 255, .24); overflow: hidden; }
  .segs b { display: block; width: 0; height: 100%; border-radius: 9px; background: var(--lime); transition: width .9s var(--ease); }

  /* Плашка с общим прогрессом на главной */
  .progress { display: flex; gap: 14px; align-items: center; margin-top: 18px; padding: 10px 14px 10px 10px; border-radius: 22px; }
  .progress p { font-size: 13.5px; line-height: 1.35; }
  .progress b { display: block; font-size: 15px; font-weight: 700; }

  /* Кольцо с процентом */
  .ring { flex: none; position: relative; width: 84px; height: 84px; }
  .ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bg { stroke: var(--lime-soft); }
  .ring .val { stroke: var(--olive); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
  .ring > b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 27px; font-weight: 700; }
  .on-dark .bg { stroke: rgba(255, 255, 255, .18); }
  .on-dark .val { stroke: var(--lime); }
  .progress .ring { width: 66px; height: 66px; }
  .progress .ring > b { font-size: 21px; }

  /* Кремовый лист поверх шапки */
  .sheet { position: relative; z-index: 2; margin-top: -30px; padding: 26px 20px 36px; border-radius: 30px 30px 0 0; background: var(--bg); }
  .lead { font-size: 15.5px; color: var(--about); }
  .sec { margin-top: 34px; }
  .sec > h2 { font-family: var(--serif); font-weight: 600; font-size: 33px; line-height: 1.02; }
  .sec > h2 + .hand { display: block; margin-top: -1px; color: var(--sage); font-size: 22px; }

  /* Вход по коду */
  .gate { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-height: 100vh; padding: 26px 22px calc(30px + env(safe-area-inset-bottom)); color: #fff; background: var(--deep); }
  .gate::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 29, 18, .2) 0%, rgba(20, 29, 18, .55) 45%, rgba(20, 29, 18, .95) 100%); }
  .gate > *:not(.hero-bg) { position: relative; z-index: 1; }
  .gate-face { display: block; width: min(68vw, 280px); aspect-ratio: 1; margin: 0 auto 22px; border-radius: 50%; object-fit: cover; border: 3px solid var(--lime); box-shadow: 0 18px 34px rgba(0, 0, 0, .45); animation: rise .9s var(--ease) both; }
  .expert { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .expert small { display: block; font-size: 12.5px; opacity: .85; }
  .expert img { flex: none; width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2px solid var(--lime); }
  .gate h1 { font-family: var(--serif); font-weight: 600; font-size: 54px; line-height: .95; margin-top: 8px; }
  .gate p { margin: 10px 0 18px; font-size: 14.5px; opacity: .9; }
  .gate input { display: block; width: 100%; margin-bottom: 10px; padding: 15px; border-radius: 18px; color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .14em; text-align: center; outline: none; }
  .gate input:focus { border-color: var(--lime); }
  .gate input::placeholder { font-size: 15px; font-weight: 500; letter-spacing: 0; color: rgba(255, 255, 255, .75); }
  .err { min-height: 22px; margin-top: 9px; font-size: 13.5px; font-weight: 600; text-align: center; color: #F2C9A8; }
  .gate-hint { font-size: 13px; text-align: center; opacity: .8; }

  /* Главная: день сегодня */
  .now { display: block; width: 100%; padding: 18px 17px; text-align: left; border-radius: 24px; background: var(--card); box-shadow: 0 12px 30px rgba(46, 61, 42, .08); }
  .now-kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--sage); }
  .now h2 { font-family: var(--serif); font-weight: 700; font-size: 29px; line-height: 1.04; margin: 5px 0 7px; }
  .now p { font-size: 14px; color: var(--muted); }
  .now-plates { display: flex; margin-top: 13px; }
  .now-plates img, .now-plates svg { width: 76px; height: 76px; margin-right: -14px; filter: drop-shadow(0 7px 9px rgba(46, 61, 42, .24)); }
  .now .btn { margin-top: 15px; }

  /* Календарь */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
  .tile { min-width: 0; padding: 9px 0 10px; border-radius: 15px; text-align: center; line-height: 1.1; background: var(--card); transition: transform .2s var(--ease); }
  .tile:active { transform: scale(.93); }
  .tile small { display: block; font-size: 11px; font-weight: 600; }
  .tile > b { display: block; margin: 3px 0 7px; font-family: var(--serif); font-size: 24px; font-weight: 700; line-height: 1; }
  .tile svg { display: block; width: 14px; height: 14px; margin: 0 auto; }
  .tile.done { background: var(--lime-soft); color: var(--olive); }
  .tile.done path { fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .tile.open { background: var(--olive); color: #fff; box-shadow: 0 8px 18px rgba(46, 61, 42, .3); }
  .tile.locked { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: #A3AB9D; }
  .tile .dot { display: block; width: 7px; height: 7px; margin: 3.5px auto; border-radius: 50%; background: var(--lime); }

  /* Материалы */
  .mats { margin-top: 14px; }
  .mat { margin-bottom: 8px; border-radius: 18px; background: var(--card); }
  .mat-head { display: flex; gap: 10px; align-items: center; width: 100%; padding: 13px 15px; text-align: left; }
  .mat-head > span { flex: 1; min-width: 0; font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.1; }
  .mat-head small { display: block; margin-top: 2px; font-family: "Manrope", sans-serif; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .mat-head i { flex: none; font-style: normal; font-size: 21px; line-height: 1; color: var(--sage); transition: transform .25s var(--ease); }
  .mat-head svg { flex: none; width: 16px; height: 16px; color: #A3AB9D; }
  .mat.open .mat-head i { transform: rotate(45deg); }
  .mat-body { display: none; padding: 0 15px 15px; font-size: 14px; color: var(--about); }
  .mat.open .mat-body { display: block; animation: rise .4s var(--ease); }
  .mat-body p + p, .mat-body ul + p, .mat-body p + ul { margin-top: 8px; }
  .mat-body ul { padding-left: 18px; }
  .mat-body li { margin: 3px 0; }
  .mat.locked .mat-head > span { color: #8E988A; }
  .mat.locked .mat-head { cursor: default; }

  /* Панель пробной версии */
  .demo { margin-top: 30px; padding: 15px; border-radius: 20px; border: 1.5px dashed var(--sage); font-size: 13.5px; color: var(--about); }
  .demo b { display: block; margin-bottom: 3px; color: var(--olive); }
  .demo-row { display: flex; gap: 7px; margin-top: 11px; }
  .demo-row button { flex: 1; padding: 11px 4px; border-radius: 13px; background: var(--lime-soft); font-size: 13px; font-weight: 700; color: var(--olive); }
  .contact { margin-top: 18px; }

  /* Подкаст */
  .player { display: flex; gap: 12px; align-items: center; margin-top: 18px; padding: 10px 14px 10px 10px; border-radius: 22px; }
  .play { flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--deep); transition: transform .2s var(--ease); }
  .play:active { transform: scale(.9); }
  .play svg { width: 19px; height: 19px; }
  .player-main { flex: 1; min-width: 0; }
  .player-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .player-top b { font-size: 14px; font-weight: 700; }
  .bars { display: flex; gap: 3px; align-items: center; height: 18px; }
  .bars i { display: block; width: 3px; height: 100%; border-radius: 3px; background: rgba(255, 255, 255, .55); transform: scaleY(var(--h)); }
  .playing .bars i { background: var(--lime); animation: bar 1s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.17s); }
  @keyframes bar { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
  .seek { display: block; width: 100%; height: 16px; margin: 2px 0 0; background: none; accent-color: var(--lime); cursor: pointer; }
  .player-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; opacity: .85; }
  .speed { padding: 0 7px; border-radius: 8px; background: rgba(255, 255, 255, .17); color: #fff; font-size: 12px; font-weight: 700; }
  .audio-err { margin-top: 8px; font-size: 13px; font-weight: 600; color: #F2C9A8; }

  /* Тарелки: фото вылезает за край карточки и экрана.
     --plate зависит от ширины экрана, а отступ текста считается от него: тарелка не заезжает на текст */
  .meals { display: grid; gap: 22px; margin-top: 26px; }
  .meal { --plate: clamp(126px, 44vw, 178px); position: relative; display: block; width: 100%; min-height: 132px; padding: 17px calc(var(--plate) - 20px) 16px 17px; text-align: left; border-radius: 24px; background: var(--card); box-shadow: 0 12px 30px rgba(46, 61, 42, .08); transition: transform .25s var(--ease); }
  .meal:active { transform: scale(.98); }
  .meal-pic { position: absolute; right: -32px; top: 50%; width: var(--plate); height: var(--plate); margin-top: calc(var(--plate) / -2); filter: drop-shadow(0 14px 16px rgba(46, 61, 42, .24)); transform: rotate(-28deg) scale(.82); transition: transform 1.1s var(--ease); }
  .meal.in .meal-pic { transform: none; }
  .meal-when { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--sage); }
  .meal h3 { font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 4px 0 8px; }
  .meal-meta { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .meal-go { display: inline-block; margin-top: 9px; font-size: 12.5px; font-weight: 700; color: var(--olive); border-bottom: 1.5px solid var(--lime); }

  /* Вода: тёмный блок */
  .water { position: relative; overflow: hidden; margin: 34px -20px 0; padding: 28px 20px 26px; color: #fff; background: var(--olive); }
  .water::before { content: ""; position: absolute; inset: 0; background: url(img/leaves.webp) center 75% / cover; opacity: .32; }
  .water > * { position: relative; }
  .water-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .water h2 { font-family: var(--serif); font-weight: 600; font-size: 33px; line-height: 1; }
  .water-num { flex: none; font-family: var(--serif); font-weight: 600; font-size: 50px; line-height: .8; color: var(--lime); }
  .water-num small { font-size: 24px; color: rgba(255, 255, 255, .7); }
  .glasses { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 20px 0 12px; }
  .glass-btn { padding: 2px 0; transition: transform .2s var(--ease); }
  .glass-btn:active { transform: scale(.88); }
  .glass-btn svg { display: block; width: 100%; max-width: 36px; height: 44px; margin: 0 auto; overflow: visible; }
  .glass-btn .w { transform: translateY(30px); transition: transform .65s cubic-bezier(.25, 1.25, .5, 1); }
  .glass-btn.full .w { transform: none; }
  .glass-btn .outline { fill: rgba(255, 255, 255, .08); stroke: rgba(255, 255, 255, .6); stroke-width: 1.6; }
  .water p { font-size: 13px; opacity: .8; }

  /* Витамины: круглые фото */
  .sups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .sup { display: block; padding: 14px 12px 13px; text-align: center; border-radius: 24px; background: var(--card); box-shadow: 0 12px 30px rgba(46, 61, 42, .07); }
  .sup img { display: block; width: 104px; height: 104px; margin: 0 auto 10px; border-radius: 50%; object-fit: cover; transition: transform .5s var(--ease); }
  .sup.on img { transform: scale(.94); }
  .sup h3 { font-family: var(--serif); font-size: 23px; font-weight: 700; line-height: 1.05; }
  .sup small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
  .sup-mark { display: inline-flex; gap: 7px; align-items: center; margin-top: 9px; font-size: 13px; font-weight: 700; }
  .sup-mark .tick { width: 24px; height: 24px; }
  .sup-mark .tick svg { width: 13px; height: 13px; }
  .sup-note { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

  /* Галочки */
  .tick { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.6px #B9C3AE; transition: background .25s, box-shadow .25s, transform .4s cubic-bezier(.3, 1.8, .5, 1); }
  .tick svg { width: 15px; height: 15px; }
  .tick path { fill: none; stroke: var(--deep); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s .08s ease-out; }
  .on .tick { background: var(--lime); box-shadow: none; transform: scale(1.08); }
  .on .tick path { stroke-dashoffset: 0; }

  /* Итог дня */
  .summary { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .summary p { font-size: 13.5px; color: var(--muted); }
  .checks { margin-top: 14px; padding: 4px 16px; border-radius: 24px; background: var(--card); box-shadow: 0 12px 30px rgba(46, 61, 42, .07); }
  .check { display: flex; gap: 12px; align-items: center; width: 100%; padding: 13px 0; text-align: left; font-size: 14.5px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .finish { margin-top: 16px; }
  .finish-note { margin-top: 16px; font-size: 13px; text-align: center; color: var(--muted); }

  /* Карточка блюда.
     --dish: размер фото. Высота шапки и отступ текста считаются от него, поэтому на любой ширине блюдо заходит на лист одинаково */
  .dish-top { --dish: min(92vw, 420px); position: relative; height: calc(var(--dish) + 2px); background: radial-gradient(90% 90% at 50% 30%, #EEF3CF 0%, #CFDD9A 100%); }
  .dish-img { position: absolute; z-index: 3; left: 50%; top: 34px; width: var(--dish); height: var(--dish); margin-left: calc(var(--dish) / -2); animation: dishin 1s var(--ease) both, float 6s 1s ease-in-out infinite; filter: drop-shadow(0 22px 22px rgba(46, 61, 42, .3)); pointer-events: none; }
  @keyframes dishin { from { opacity: 0; transform: translateY(-34px) scale(.8) rotate(-9deg); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
  .dish-sheet { position: relative; z-index: 2; margin-top: -26px; padding: 84px 20px 40px; border-radius: 30px 30px 0 0; background: var(--bg); }
  .dish-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .dish-head h1 { font-family: var(--serif); font-weight: 700; font-size: 35px; line-height: 1; }
  .time { flex: none; margin-top: 6px; padding: 5px 11px; border-radius: 99px; background: var(--lime-soft); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .dish-text { margin-top: 10px; font-size: 14.5px; color: var(--about); }
  .nutri { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; margin-top: 16px; padding: 14px 6px; border-radius: 20px; background: var(--card); box-shadow: 0 10px 26px rgba(46, 61, 42, .07); text-align: center; }
  .nutri div + div { border-left: 1px solid var(--line); }
  .nutri b { display: block; font-family: var(--serif); font-size: 27px; font-weight: 700; line-height: 1; }
  .nutri small { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .parts { margin-top: 24px; }
  .parts-title, .list-head { font-family: var(--serif); font-weight: 600; font-size: 25px; }
  .bar { display: flex; gap: 2px; height: 14px; margin-top: 10px; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; width: 0; transition: width 1s var(--ease); }
  .legend { display: grid; gap: 5px; margin-top: 10px; font-size: 13.5px; }
  .legend div { display: flex; gap: 8px; align-items: baseline; }
  .legend i { flex: none; width: 9px; height: 9px; border-radius: 50%; align-self: center; }
  .legend span { flex: 1; min-width: 0; color: var(--about); }
  .legend b { font-weight: 700; }

  .step { display: flex; gap: 12px; margin-top: 14px; font-size: 14.5px; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * .07s); }

  .over { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: rgba(18, 26, 16, .55); animation: fade .3s; }

  .done { position: relative; width: 100%; max-width: 560px; padding: 30px 24px calc(26px + env(safe-area-inset-bottom)); text-align: center; color: #fff; border-radius: 30px 30px 0 0; background: var(--olive); animation: up .55s var(--ease); }

  .leaf { position: absolute; top: -30px; z-index: 21; width: 14px; height: 20px; border-radius: 0 100% 0 100%; animation: fall var(--t) linear forwards; animation-delay: var(--d); pointer-events: none; }

  .up { padding: 13px 14px; border-radius: 20px; background: var(--card); box-shadow: 0 10px 26px rgba(46, 61, 42, .07); font-size: 12.5px; color: var(--muted); }

  .stat-row { display: flex; justify-content: space-between; gap: 10px; }
  .stat-row span:last-child { flex: none; color: var(--muted); font-weight: 700; }
  .track { height: 9px; margin-top: 6px; border-radius: 99px; background: var(--lime-soft); overflow: hidden; }
  .track i { display: block; width: 0; height: 100%; border-radius: 99px; background: var(--olive); transition: width 1.2s var(--ease); }
  .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; align-items: end; height: 130px; margin-top: 16px; }
  .days div { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .days i { display: block; height: 0; margin-bottom: 5px; border-radius: 9px 9px 3px 3px; background: linear-gradient(180deg, var(--lime), var(--veg)); transition: height 1.1s var(--ease); }
  .res-btns { display: grid; gap: 8px; margin-top: 26px; }

    .meal-pic { transform: none; transition: none; }
    .leaf { display: none; }
  }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function haptic(kind = "light") {

}

  haptic();

/* ---------- Хранение: прогресс каждого человека лежит в облаке Telegram и на устройстве ---------- */
const META_KEY = CONFIG.streamId + "_meta";
const dayKey = n => CONFIG.streamId + "_d" + n;
const ALL_KEYS = [META_KEY, ...CONFIG.days.map((_, i) => dayKey(i + 1))];
const hasCloud = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") && tg.CloudStorage;

let meta = { in: false, start: null, off: 0 };
const days = {};   // { номер дня: { c: [отмеченные пункты и витамины], w: стаканов воды, h: { "обед": [есть ингредиенты] }, f: 1 — день завершён } }

function localGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function localSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}
function parse(value) {
  try { return value ? JSON.parse(value) : null; } catch (e) { return null; }
}
function saveKey(key, obj) {
  const value = JSON.stringify(obj);
  localSet(key, value);
  if (hasCloud) { try { tg.CloudStorage.setItem(key, value); } catch (e) {} }
}
const saveMeta = () => saveKey(META_KEY, meta);
const saveDay = n => saveKey(dayKey(n), day(n));

function applyStored(get) {
  const m = parse(get(META_KEY));
  if (m) meta = Object.assign(meta, m);
  CONFIG.days.forEach((_, i) => {
    const d = parse(get(dayKey(i + 1)));
    if (d) days[i + 1] = d;
  });
}

// Облако может ответить с задержкой. Не ждём дольше 2,5 секунды, тогда берём данные с устройства.
function loadState() {
  applyStored(localGet);
  if (!hasCloud) return Promise.resolve();
  return new Promise(resolve => {
    const timer = setTimeout(resolve, 2500);
    try {
      tg.CloudStorage.getItems(ALL_KEYS, (err, values) => {
        clearTimeout(timer);
        if (!err && values) {
          applyStored(key => values[key] || null);
          ALL_KEYS.forEach(key => { if (values[key]) localSet(key, values[key]); });
        }
        resolve();
      });
    } catch (e) { clearTimeout(timer); resolve(); }
  });
}

function clearState() {
  ALL_KEYS.forEach(key => { try { localStorage.removeItem(key); } catch (e) {} });
  if (hasCloud) { try { tg.CloudStorage.removeItems(ALL_KEYS); } catch (e) {} }
  Object.keys(days).forEach(k => delete days[k]);
}

/* ---------- Даты: считаем в целых днях, чтобы не зависеть от часов и перевода времени ---------- */
function realToday() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
}
function today() { return realToday() + (CONFIG.demo ? meta.off || 0 : 0); }
function startNum() {
  if (CONFIG.startDate !== "auto") return Math.floor(Date.parse(CONFIG.startDate + "T00:00:00Z") / 864e5);
  return meta.start ?? realToday();
}
const dayDate = n => startNum() + n - 1;
function fmt(num, opts) {
  return new Date(num * 864e5).toLocaleDateString("ru-RU", Object.assign({ timeZone: "UTC" }, opts));
}
const fmtLong = num => fmt(num, { day: "numeric", month: "long" });
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11) ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c;

/* ---------- Состояние дней ---------- */
function day(n) {
  if (!days[n]) days[n] = { c: [], w: 0 };
  return days[n];
}
const isDone = n => !!(days[n] && days[n].f);
const dateReached = n => today() >= dayDate(n);
const isPreview = n => !!CONFIG.openDays && n > CONFIG.openDays;
const isOpen = n => !isPreview(n) && dateReached(n) && (n === 1 || isDone(n - 1));
const allNums = () => CONFIG.days.map((_, i) => i + 1);
const allDone = () => allNums().every(isDone);
function currentDay() {
  for (let n = 1; n <= TOTAL; n++) if (!isDone(n)) return n;
  return null;
}
function lockReason(n) {
  if (isPreview(n)) return "В настоящем марафоне день " + n + " откроется по календарю. В этом примере открыт первый день";
  if (!dateReached(n)) return "День " + n + " откроется " + fmtLong(dayDate(n));
  return "Сначала завершите день " + (n - 1);
}

function dayItems(n) {
  return CONFIG.checklist.filter(it => it.id !== "audio" || CONFIG.days[n - 1].audio);
}
function itemOn(n, id) {
  const d = days[n];
  if (!d) return false;
  const c = d.c || [];
  if (id === "water") return (d.w || 0) >= CONFIG.waterGoal;
  if (id === "sup") return CONFIG.supplements.every(s => c.includes("sup_" + s.id));
  return c.includes(id);
}
function toggle(n, id) {
  const d = day(n);
  d.c = d.c.includes(id) ? d.c.filter(x => x !== id) : [...d.c, id];
}
function dayCounts(n) {
  const items = dayItems(n);
  return { done: items.filter(it => itemOn(n, it.id)).length, total: items.length };
}
function dayPct(n) {
  const c = dayCounts(n);
  return Math.round(c.done / c.total * 100);
}
// Процент по списку дней: считаем пункты, а не среднее по дням
function pctOf(list) {
  let done = 0, total = 0;
  list.forEach(n => { const c = dayCounts(n); done += c.done; total += c.total; });
  return total ? Math.round(done / total * 100) : 0;
}
function habitStats() {
  return CONFIG.checklist.map(it => {
    const relevant = allNums().filter(n => dayItems(n).some(x => x.id === it.id));
    return { title: it.title, done: relevant.filter(n => itemOn(n, it.id)).length, total: relevant.length };
  }).filter(s => s.total);
}

/* ---------- Рисунки и анимация ---------- */
function countUp(el, to, ms = 900) {
  if (!el) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to; el.dataset.now = to; return; }
  const from = +el.dataset.now || 0;
  el.dataset.now = to;
  const start = performance.now();
  const step = t => {
    const k = Math.min((t - start) / ms, 1);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function plateSvg(parts, cls) {
  const sum = parts.reduce((s, p) => s + p[1], 0);
  const c = 50, r = 37;
  let angle = -Math.PI / 2;
  const slices = parts.map(p => {
    const a = p[1] / sum * Math.PI * 2;
    const x1 = c + r * Math.cos(angle), y1 = c + r * Math.sin(angle);
    angle += a;
    const x2 = c + r * Math.cos(angle), y2 = c + r * Math.sin(angle);
    const big = a > Math.PI ? 1 : 0;
    return `<path d="M${c} ${c}L${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${PART[p[0]][1]}" stroke="#fff" stroke-width="1.6"/>`;
  }).join("");
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#fff" stroke="rgba(46,61,42,.16)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(46,61,42,.1)" stroke-width="1"/>
    ${slices}
  </svg>`;
}
function mealPic(n, key, cls, alt = "") {
  const meal = CONFIG.days[n - 1].meals[key];
  if (n <= CONFIG.photoDays) return `<img class="${cls}" src="img/d${n}-${key}.webp" alt="${esc(alt)}">`;
  return plateSvg(meal.parts, cls);
}

function ringHtml(pct, dark) {
  const R = 38, len = (2 * Math.PI * R).toFixed(1);
  return `<div class="ring ${dark ? "on-dark" : ""}" data-pct="${pct}">
    <svg viewBox="0 0 84 84" aria-hidden="true"><circle class="bg" cx="42" cy="42" r="${R}"/><circle class="val" cx="42" cy="42" r="${R}" stroke-dasharray="${len}" stroke-dashoffset="${len}"/></svg>
    <b><span class="ring-num">0</span>%</b>
  </div>`;
}
function paintRing(ring, pct, ms) {
  const val = ring.querySelector(".val");
  val.style.strokeDashoffset = 2 * Math.PI * 38 * (1 - pct / 100);
  countUp(ring.querySelector(".ring-num"), pct, ms);
}
function startRings(ms = 1000) {
  setTimeout(() => app.querySelectorAll(".ring[data-pct]").forEach(r => paintRing(r, +r.dataset.pct, ms)), 250);
}

function segsHtml(current) {

    const w = isDone(n) ? 100 : n === current ? dayPct(n) : 0;

  }).join("")}</div>`;
}
function startSegs() {
  setTimeout(() => app.querySelectorAll("[data-seg]").forEach(el => el.style.width = el.dataset.w + "%"), 500);
}

let io;
function observe() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) { app.querySelectorAll(".reveal").forEach(el => el.classList.add("in")); return; }
  io = new IntersectionObserver(items => items.forEach(it => {
    if (it.isIntersecting) { it.target.classList.add("in"); io.unobserve(it.target); }
  }), { threshold: .12 });
  app.querySelectorAll(".reveal").forEach(el => io.observe(el));
}

function progressHtml() {

  let main, sub;
  if (now < start) {

    main = `Начинаем ${fmtLong(start)}`;
    sub = `Ещё ${left} ${plural(left, "день", "дня", "дней")}`;

    ${m.ingr.map((g, i) => `<button class="ingr ${have.includes(i) ? "on" : ""}" data-act="ingr" data-v="${i}">
      <span class="tick">${ICON.tick}</span>
      <span class="ingr-main">${esc(g[0])}<small>${esc(g[1])}</small></span>
      <span class="have">Уже есть</span>
    </button>`).join("")}` : `
    <div class="list-head"><span>Шаг за шагом</span><small>1 порция</small></div>
    ${m.steps.map((s, i) => `<div class="step" style="--i:${i}"><b>${i + 1}</b><span>${esc(s)}</span></div>`).join("")}`;
  if (tab === 0) paintBuy(n, key);
}

function paintBuy(n, key) {
  const m = CONFIG.days[n - 1].meals[key];
  const have = (days[n] && days[n].h && days[n].h[key]) || [];
  const left = m.ingr.length - have.length;
  app.querySelector("#tobuy").textContent = left ? "Докупить: " + left : "Всё есть";
}

function renderResult() {
  const nums = allNums();
  const sample = CONFIG.openDays ? CONFIG.sampleResult : null;
  const stats = sample ? CONFIG.checklist.map((it, i) => ({ title: it.title, done: sample.stats[i], total: TOTAL })) : habitStats();
  const pct = sample ? Math.round(stats.reduce((s, x) => s + x.done, 0) / (stats.length * TOTAL) * 100) : pctOf(nums);
  const dayValue = n => sample ? sample.days[n - 1] : dayPct(n);
  const band = CONFIG.bands.find(b => pct >= b.from);
  const ratio = s => s.done / s.total;
  const best = stats.reduce((a, b) => ratio(b) > ratio(a) ? b : a);
  const worst = stats.reduce((a, b) => ratio(b) < ratio(a) ? b : a);
  app.innerHTML = `
    <header class="hero res-hero">
      <div class="hero-bg"></div>
      <button class="round browser-only" data-go="#" aria-label="Назад">‹</button>
      <div class="kicker rise">${sample ? "Пример итога" : "Итог марафона"}</div>
      <div class="rise" style="--d:.1s">${ringHtml(pct, true)}</div>
      <h1 class="rise" style="--d:.3s">${esc(band.title)}</h1>
      <div class="hand rise" style="--d:.4s">${esc(band.hand)}</div>
      <p class="rise" style="--d:.5s">Вы выполнили ${pct}% рекомендаций. ${esc(band.text)}</p>
      ${sample ? `<p class="rise" style="--d:.6s"><b>Это пример экрана, цифры для показа.</b> Так итог выглядит в конце настоящего марафона.</p>` : ""}
    </header>
    <main class="sheet">
      ${ratio(best) > ratio(worst) ? `
      <div class="ups rise" style="--d:.6s">
        <div class="up">Легче всего, ${best.done} из ${best.total}<b>${esc(best.title)}</b></div>
        <div class="up">Есть запас, ${worst.done} из ${worst.total}<b>${esc(worst.title)}</b></div>
      </div>` : ""}
      <section class="sec rise" style="--d:.7s">
        <h2>По привычкам</h2>
        ${stats.map(s => `<div class="stat">
          <div class="stat-row"><span>${esc(s.title)}</span><span>${s.done} из ${s.total}</span></div>
          <div class="track"><i data-w="${Math.round(ratio(s) * 100)}"></i></div>
        </div>`).join("")}
      </section>
      <section class="sec reveal">
        <h2>По дням</h2>
        <div class="days">${nums.map(n => `<div><i data-h="${dayValue(n)}"></i>${n}</div>`).join("")}</div>
      </section>
      <div class="res-btns">
        ${sample ? `<button class="btn" data-go="#">Вернуться к календарю</button>` : `
        <button class="btn" data-act="send">Отправить итог куратору</button>
        ${CONFIG.demo ? `<button class="btn ghost" data-act="reset">Пройти заново</button>` : ""}`}
      </div>
      <div class="note">${esc(CONFIG.footnote)}</div>
    </main>`;
  setMainButton(null);
  observe();
  startRings(1600);
  setTimeout(() => app.querySelectorAll(".track i").forEach(el => el.style.width = el.dataset.w + "%"), 350);
  setTimeout(() => app.querySelectorAll(".days i").forEach(el => el.style.height = `calc((100% - 22px) * ${Math.max(+el.dataset.h, 4) / 100})`), 800);
}

function resultMessage() {
  const lines = habitStats().map(s => `${s.title}: ${s.done} из ${s.total}`);
  return `Мой итог марафона «${CONFIG.title}»: ${pctOf(allNums())}%\n${lines.join("\n")}`;
}

function closeOverlays() {
  document.querySelectorAll(".over").forEach(el => el.remove());
}

function showFinishSheet(n) {
  const pct = dayPct(n);
  const last = n === TOTAL;
  const next = CONFIG.days[n];
  const preview = isPreview(n + 1);
  const nextText = last ? "Это был последний день. Посмотрите, что получилось за весь марафон."
    : preview ? `В настоящем марафоне завтра откроется день ${n + 1}, «${next.title}». А пока можно посмотреть, как выглядит итог.`
    : dateReached(n + 1) ? `Уже открыт день ${n + 1}, «${next.title}».`
    : `День ${n + 1}, «${next.title}», откроется ${fmtLong(dayDate(n + 1))}.`;
  const title = pct >= 80 ? "Отличный день" : pct >= 50 ? "Хороший день" : "День закрыт, продолжаем";
  const colors = ["#C9DC6B", "#7DA45F", "#E4EBBD", "#E2B84F"];
  const leaves = (pct >= 50 || last) ? Array.from({ length: 26 }, () => `<i class="leaf" style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * 4)]};--t:${2 + Math.random() * 1.6}s;--d:${Math.random() * .6}s;--x:${(Math.random() - .5) * 120}px;--r:${(Math.random() - .5) * 900}deg"></i>`).join("") : "";
  const wrap = document.createElement("div");
  wrap.className = "over";
  wrap.innerHTML = `${leaves}<div class="done" role="dialog" aria-modal="true">
    <div class="done-num"><span id="dpct">0</span>%</div>
    <h2>${esc(title)}</h2>
    <p>${esc(nextText)}</p>
    <button class="btn lime" data-go="${last || preview ? "#result" : "#"}">${preview ? "Посмотреть пример итога" : last ? "Посмотреть итог" : "К календарю"}</button>
    ${preview ? `<button class="link" data-go="#">К календарю</button>` : ""}
  </div>`;
  document.body.appendChild(wrap);
  setTimeout(() => countUp(wrap.querySelector("#dpct"), pct, 1200), 200);
  wrap.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b) { wrap.remove(); go(b.dataset.go); }
  });
  setMainButton(null);
}

function showNotice(text) {
  closeOverlays();
  const wrap = document.createElement("div");
  wrap.className = "over";
  wrap.innerHTML = `<div class="done" role="dialog" aria-modal="true"><h2 style="margin:0 0 16px">${esc(text)}</h2><button class="btn lime">Понятно</button></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e => { if (e.target === wrap || e.target.closest("button")) wrap.remove(); });
}

/* ---------- Подкаст ---------- */
function clock(sec) {
  if (!isFinite(sec)) return "0:00";
  return Math.floor(sec / 60) + ":" + String(Math.floor(sec % 60)).padStart(2, "0");
}
function stopAudio() {
  aud.pause();
  aud.onplay = aud.onpause = aud.ontimeupdate = aud.onended = aud.onerror = aud.onloadedmetadata = null;
  aud.removeAttribute("src");
  aud.load();
}
function setupAudio(n) {
  const src = CONFIG.days[n - 1].audio;
  if (!src) return;
  const player = app.querySelector("#player");
  const btn = app.querySelector(".play");
  const seek = app.querySelector("#seek");
  const time = app.querySelector("#time");
  const err = app.querySelector("#audio-err");
  const paint = () => {
    if (aud.duration) {
      seek.value = aud.currentTime / aud.duration * 100;
      time.textContent = clock(aud.currentTime) + " / " + clock(aud.duration);
    }
  };
  aud.src = src;
  aud.preload = "metadata";
  aud.playbackRate = 1;
  aud.onloadedmetadata = paint;
  aud.ontimeupdate = paint;
  aud.onplay = () => { btn.innerHTML = ICON.pause; player.classList.add("playing"); err.hidden = true; };
  aud.onpause = () => { btn.innerHTML = ICON.play; player.classList.remove("playing"); };
  aud.onerror = () => { err.hidden = false; };
  aud.onended = () => {
    aud.currentTime = 0;
    if (!itemOn(n, "audio")) { toggle(n, "audio"); saveDay(n); paintDay(n); }
  };
  seek.oninput = () => { if (aud.duration) aud.currentTime = seek.value / 100 * aud.duration; };
}

/* ---------- Переходы и кнопки Telegram ---------- */
let mainAction = null;
function setMainButton(text, action) {
  mainAction = action || null;
  if (!inTelegram) return;
  if (text) { tg.MainButton.setText(text); tg.MainButton.show(); }
  else tg.MainButton.hide();
}

function go(hash) {
  haptic();
  if (location.hash === hash || (hash === "#" && !location.hash)) route();
  else location.hash = hash;
}

// Адреса: #day3 — день, #day3/lunch — блюдо, #result — итог
function parseHash() {
  const m = location.hash.match(/^#day(\d+)(?:\/(\w+))?$/);
  if (!m) return { n: 0, key: "" };
  return { n: +m[1], key: m[2] || "" };
}
function parentHash() {
  const { n, key } = parseHash();
  return key ? "#day" + n : "#";
}

function route() {
  stopAudio();
  closeOverlays();
  if (!meta.in) { renderGate(); return; }
  const { n, key } = parseHash();
  const dayOk = n >= 1 && n <= TOTAL && isOpen(n);
  const dishOk = dayOk && !!MEAL_NAMES[key];
  const resultOk = location.hash === "#result" && (allDone() || !!CONFIG.openDays);
  if (dishOk) renderDish(n, key);
  else if (dayOk && !key) renderDay(n);
  else if (resultOk) renderResult();
  else renderHome();
  if (inTelegram) { if (dishOk || (dayOk && !key) || resultOk) tg.BackButton.show(); else tg.BackButton.hide(); }
  scrollTo(0, 0);
}

function bindEvents() {
  app.addEventListener("submit", e => {
    e.preventDefault();
    const value = app.querySelector("#code").value.trim().toUpperCase();
    if (!CONFIG.accessCodes.some(c => String(c).toUpperCase() === value)) {
      haptic("medium");
      app.querySelector("#err").textContent = value ? "Такого кода нет. Проверьте его в чате участниц." : "Введите код доступа";
      return;
    }
    meta.in = true;
    if (CONFIG.startDate === "auto" && meta.start == null) meta.start = realToday();
    saveMeta();
    route();
  });

  app.addEventListener("click", e => {
    const goEl = e.target.closest("[data-go]");
    if (goEl) { go(goEl.dataset.go); return; }

    const tile = e.target.closest("[data-day]");
    if (tile) {
      const n = +tile.dataset.day;
      if (isOpen(n)) go("#day" + n);
      else { haptic(); showNotice(lockReason(n)); }
      return;
    }

    const el = e.target.closest("[data-act]");
    if (!el) return;
    const { n, key } = parseHash();
    switch (el.dataset.act) {
      case "mat":
        haptic();
        el.closest(".mat").classList.toggle("open");
        break;
      case "glass": {
        haptic();
        const v = +el.dataset.v;
        // Нажатие на последний полный стакан убирает его: на случай, если нажали случайно
        day(n).w = day(n).w === v ? v - 1 : v;
        saveDay(n);
        paintDay(n);
        break;
      }
      case "sup":
        haptic();
        toggle(n, "sup_" + el.dataset.id);
        saveDay(n);
        paintDay(n);
        break;
      case "check": {
        haptic();
        const id = el.dataset.id;
        const d = day(n);
        if (id === "water") d.w = itemOn(n, "water") ? 0 : CONFIG.waterGoal;
        else if (id === "sup") {
          const on = !itemOn(n, "sup");
          d.c = d.c.filter(x => !x.startsWith("sup_"));
          if (on) CONFIG.supplements.forEach(s => d.c.push("sup_" + s.id));
        }
        else toggle(n, id);
        saveDay(n);
        paintDay(n);
        break;
      }
      case "finish":
        haptic("medium");
        day(n).f = 1;
        saveDay(n);
        el.outerHTML = `<div class="finish-note">День завершён. Отметки можно поправить, процент пересчитается сам.</div>`;
        showFinishSheet(n);
        break;
      case "tab":
        haptic();
        renderTab(n, key, +el.dataset.v);
        break;
      case "ingr": {
        haptic();
        const d = day(n);
        d.h = d.h || {};
        const have = d.h[key] || [];
        const i = +el.dataset.v;
        d.h[key] = have.includes(i) ? have.filter(x => x !== i) : [...have, i];
        saveDay(n);
        el.classList.toggle("on", d.h[key].includes(i));
        paintBuy(n, key);
        break;
      }
      case "play":
        if (aud.paused) aud.play().catch(() => { app.querySelector("#audio-err").hidden = false; });
        else aud.pause();
        break;
      case "speed": {
        const next = aud.playbackRate === 1 ? 1.5 : aud.playbackRate === 1.5 ? 2 : 1;
        aud.playbackRate = next;
        el.textContent = String(next).replace(".", ",") + "×";
        break;
      }
      case "off":
        haptic();
        meta.off = (meta.off || 0) + +el.dataset.v;
        saveMeta();
        route();
        break;
      case "reset":
        clearState();
        meta = { in: true, start: realToday(), off: 0 };
        saveMeta();
        go("#");
        break;
      case "curator":
        openUrl(CONFIG.curatorUrl);
        break;
      case "send":
        openUrl(CONFIG.curatorUrl + "?text=" + encodeURIComponent(resultMessage()));
        break;
    }
  });

  addEventListener("hashchange", route);
}

function initTelegram() {
  if (!inTelegram) return;
  document.body.classList.add("in-tg");
  tg.ready();
  tg.expand();
  const css = getComputedStyle(document.documentElement);
  tg.setHeaderColor(css.getPropertyValue("--deep").trim());
  tg.setBackgroundColor(css.getPropertyValue("--bg").trim());
  tg.MainButton.setParams({ color: css.getPropertyValue("--main-btn").trim(), text_color: "#FFFFFF" });
  tg.MainButton.onClick(() => { if (mainAction) mainAction(); });
  tg.BackButton.onClick(() => go(parentHash()));
}

initTelegram();
bindEvents();
loadState().then(route);
</script>
